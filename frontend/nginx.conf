# Serves the built Vite SPA on :5173. API calls go straight to the backend
# (VITE_API_URL, baked at build time) — nginx only serves static files here.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths resolve to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let browsers cache the HTML shell: it references the fingerprinted
    # bundles, so a stale copy pins users to an old build after each redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Long-cache the fingerprinted assets Vite emits under /assets/.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
